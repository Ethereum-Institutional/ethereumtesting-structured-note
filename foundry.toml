[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
solc_version = '0.8.26'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 44444444   # matches upstream v4-periphery; the IR pipeline needs it to clear Pool.swap
via_ir = true   # v4-core's Pool library needs the IR pipeline (matches upstream v4-periphery)
ffi = true
fs_permissions = [{ access = "read-write", path = "./ops" }, { access = "read", path = "./out" }]
bytecode_hash = 'none'
gas_limit = "3000000000"


remappings = [
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "v4-periphery/=lib/v4-periphery/",
  "@openzeppelin/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "forge-std/=lib/forge-std/src/",
  "uniswap-hooks/=lib/uniswap-hooks/",
  "ds-test/=lib/v4-periphery/lib/v4-core/lib/forge-std/lib/ds-test/src/",
]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
