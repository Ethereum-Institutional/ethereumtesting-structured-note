# The instruments' compilation unit: the note as an ERC-3643 token (T-REX), its identities and
# lifecycle, and the tokenized deposit.
#
# T-REX 5.0.0-beta2 pins solc 0.8.30 exactly, so the whole unit compiles with it (ADR 0085).
# Dependencies are pinned through Soldeer (soldeer.lock); `forge soldeer install` fetches them.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
allow_paths = ["../lib/forge-std"]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# The deploy script extends the venue stack's manifest.
fs_permissions = [{ access = "read-write", path = "../ops" }, { access = "read", path = "./test/vectors" }]
remappings = [
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.6.1/",
  "@onchain-id/solidity/=dependencies/onchain-id-2.2.2-beta3/",
  "t-rex/=dependencies/t-rex-5.0.0-beta2/contracts/",
  "forge-std/=../lib/forge-std/src/",
]

# Tests against the running local stack: ./ops/reset.sh, then
#   FOUNDRY_PROFILE=fork forge test --fork-url http://127.0.0.1:8545
[profile.fork]
src = "src"
test = "test-fork"
out = "out"
libs = ["dependencies"]
allow_paths = ["../lib/forge-std"]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "../ops" }]
remappings = [
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.6.1/",
  "@onchain-id/solidity/=dependencies/onchain-id-2.2.2-beta3/",
  "t-rex/=dependencies/t-rex-5.0.0-beta2/contracts/",
  "forge-std/=../lib/forge-std/src/",
]

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
"@openzeppelin-contracts" = "5.6.1"
"@openzeppelin-contracts-upgradeable" = "5.6.1"
onchain-id = { version = "2.2.2-beta3", git = "https://github.com/onchain-id/solidity.git", tag = "2.2.2-beta3" }
t-rex = { version = "5.0.0-beta2", git = "https://github.com/T-REX-Network/T-REX.git", tag = "5.0.0-beta2" }
