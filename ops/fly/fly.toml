# Always-on anvil serving the demo chain over a public HTTPS RPC endpoint.
#
# Singapore region: the audience is APAC, and the Vercel console calls this server-side, so
# round-trip latency to the region closest to the room is what matters.
app = "apac-rwa-chain"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8545
  force_https = true
  # Never suspend: a machine restart resets the chain to the baked snapshot, which must not
  # happen in the middle of a demo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # No HTTP health check: anvil answers only JSON-RPC POSTs, so a GET or empty POST probe
  # would fail and restart the machine -- which would reset the chain mid-demo. Fly's default
  # TCP connectivity check is the right level here.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
