# Spikes 1 and 2: the instrument's own compilation unit. See docs/spikes/.
# The debt standard is the copy pinned in instruments/, so the spike and Wave 2 build on one pin.
#
# Separate from the venue's unit by necessity: the note fits under EIP-170 only on the legacy
# pipeline at solc 0.8.27 or later, while the venue is pinned to 0.8.26 on the IR pipeline.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../../instruments/lib"]
allow_paths = ["../../lib/forge-std", "../../instruments/lib"]
solc_version = "0.8.34"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
remappings = [
  "debt-standard/=../../instruments/lib/debt-standard/contracts/",
  "@openzeppelin/contracts-upgradeable/=../../instruments/lib/debt-standard/lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=../../instruments/lib/debt-standard/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../lib/forge-std/src/",
]
